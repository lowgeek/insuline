<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1625">
    <title>🐱 Suivi Insuline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1625;
            --bg-secondary: #2a2538;
            --bg-card: #352f47;
            --accent-primary: #ff6b9d;
            --accent-secondary: #c084fc;
            --accent-success: #4ade80;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #4a4560;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #251e38 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        .sync-dot.syncing {
            background: var(--accent-secondary);
        }

        .sync-dot.error {
            background: var(--accent-primary);
            animation: none;
        }

        .status-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out 0.1s both;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.done {
            background: var(--accent-success);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .status-dot.pending {
            background: var(--accent-primary);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .last-injection {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-family: 'Crimson Pro', serif;
        }

        .last-injection strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .action-button {
            width: 100%;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'DM Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-button:active::before {
            width: 400px;
            height: 400px;
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-record {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            margin-bottom: 16px;
        }

        .btn-record:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5);
        }

        .btn-record:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-card);
            border-color: var(--accent-primary);
        }

        .history-section {
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .section-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease-out backwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .history-date {
            font-weight: 600;
            color: var(--text-primary);
        }

        .history-time {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .history-period {
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .history-actions {
            display: flex;
            gap: 8px;
            margin-left: 12px;
        }

        .history-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .history-btn.edit {
            background: var(--bg-secondary);
            color: var(--accent-secondary);
        }

        .history-btn.edit:hover {
            background: var(--accent-secondary);
            color: white;
        }

        .history-btn.delete {
            background: var(--bg-secondary);
            color: var(--accent-primary);
        }

        .history-btn.delete:hover {
            background: var(--accent-primary);
            color: white;
        }

        .history-item-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .history-item-info {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-style: italic;
        }

        .confirmation {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--accent-success), #22c55e);
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(74, 222, 128, 0.4);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .confirmation.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .config-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.15s both;
        }

        .config-section input {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .config-section input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .config-section label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .status-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation" id="confirmation">✓ Injection enregistrée !</div>
    
    <div class="container">
        <header>
            <h1>🐱 Suivi Insuline</h1>
            <p class="subtitle">Gardez une trace précise des injections</p>
            <div class="sync-status">
                <div class="sync-dot" id="syncDot"></div>
                <span id="syncStatus">Synchronisation...</span>
            </div>
        </header>

        <div class="config-section" id="configSection">
            <label for="scriptUrl">URL du script Google Apps Script :</label>
            <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/...../exec">
            <button class="action-button btn-record" style="margin-top: 16px;" onclick="saveConfig()">
                💾 Sauvegarder la configuration
            </button>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Chargement...</div>
            </div>
            
            <div class="last-injection" id="lastInjection">
                Aucune injection enregistrée aujourd'hui
            </div>

            <button class="action-button btn-record" id="recordBtn" onclick="recordInjection()" disabled>
                💉 Enregistrer l'injection
            </button>
            
            <button class="action-button btn-secondary" id="customTimeBtn" onclick="showTimePicker()" disabled>
                🕐 Enregistrer avec heure personnalisée
            </button>
        </div>

        <div class="history-section">
            <h2 class="section-title">Historique (7 derniers jours)</h2>
            <div class="history-list" id="historyList">
                <div class="empty-state">Aucun historique disponible</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const SCRIPT_URL_KEY = 'catInsulin_scriptUrl';
        let SCRIPT_URL = localStorage.getItem(SCRIPT_URL_KEY) || '';

        // État de synchronisation
        let isSyncing = false;

        // Sauvegarder la configuration
        function saveConfig() {
            const input = document.getElementById('scriptUrl');
            const url = input.value.trim();
            
            if (!url) {
                alert('Veuillez entrer une URL valide');
                return;
            }

            localStorage.setItem(SCRIPT_URL_KEY, url);
            SCRIPT_URL = url;
            
            document.getElementById('configSection').style.display = 'none';
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('customTimeBtn').disabled = false;
            
            loadInjections();
        }

        // Vérifier la configuration au chargement
        function checkConfig() {
            if (SCRIPT_URL) {
                document.getElementById('configSection').style.display = 'none';
                document.getElementById('scriptUrl').value = SCRIPT_URL;
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('customTimeBtn').disabled = false;
                loadInjections();
            } else {
                updateSyncStatus('Configuration requise', 'error');
            }
        }

        // Mettre à jour le statut de synchronisation
        function updateSyncStatus(message, status = 'success') {
            const syncDot = document.getElementById('syncDot');
            const syncStatus = document.getElementById('syncStatus');
            
            syncDot.className = 'sync-dot ' + status;
            syncStatus.textContent = message;
        }

        // Charger les injections depuis Google Sheets
        async function loadInjections() {
            if (!SCRIPT_URL) return;

            updateSyncStatus('Synchronisation...', 'syncing');
            isSyncing = true;

            try {
                const response = await fetch(SCRIPT_URL + '?action=get', {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    updateDisplay(data.injections || []);
                    updateSyncStatus('Synchronisé', 'success');
                } else {
                    throw new Error(data.error || 'Erreur de chargement');
                }
            } catch (error) {
                console.error('Erreur de chargement:', error);
                console.error('URL utilisée:', SCRIPT_URL);
                updateSyncStatus('Erreur: ' + error.message, 'error');
                
                // Afficher une alerte plus détaillée sur mobile
                if (confirm('Erreur de synchronisation. Voulez-vous voir les détails ?')) {
                    alert('Erreur: ' + error.message + '\n\nURL: ' + SCRIPT_URL + '\n\nVérifiez que le script est déployé pour "Tout le monde"');
                }
            } finally {
                isSyncing = false;
            }
        }

        // Enregistrer une injection
        async function recordInjection() {
            await saveInjection(Date.now());
        }

        // Sauvegarder une injection
        async function saveInjection(timestamp) {
            if (!SCRIPT_URL || isSyncing) return;

            updateSyncStatus('Enregistrement...', 'syncing');
            isSyncing = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `action=add&timestamp=${timestamp}`,
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    showConfirmation();
                    await loadInjections();
                } else {
                    throw new Error(data.error || 'Erreur d\'enregistrement');
                }
            } catch (error) {
                console.error('Erreur d\'enregistrement:', error);
                alert('Erreur lors de l\'enregistrement: ' + error.message + '\n\nVérifiez votre connexion Internet et que le script est bien déployé.');
                updateSyncStatus('Erreur: ' + error.message, 'error');
            } finally {
                isSyncing = false;
            }
        }

        // Afficher le sélecteur d'heure personnalisé
        function showTimePicker() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const defaultTime = `${hours}:${minutes}`;
            
            const time = prompt('Entrez l\'heure de l\'injection (HH:MM):', defaultTime);
            
            if (time) {
                const [h, m] = time.split(':');
                const customDate = new Date();
                customDate.setHours(parseInt(h), parseInt(m), 0, 0);
                saveInjection(customDate.getTime());
            }
        }

        // Afficher la confirmation
        function showConfirmation(message = '✓ Injection enregistrée !') {
            const conf = document.getElementById('confirmation');
            conf.textContent = message;
            conf.classList.add('show');
            setTimeout(() => {
                conf.classList.remove('show');
            }, 3000);
        }

        // Modifier une injection
        async function editInjection(oldTimestamp) {
            const oldDate = new Date(oldTimestamp);
            const dateStr = oldDate.toLocaleDateString('fr-FR');
            const timeStr = oldDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            const newDateTime = prompt(
                `Modifier l'injection du ${dateStr} à ${timeStr}\n\nEntrez la nouvelle date et heure (format: JJ/MM/AAAA HH:MM):`,
                `${dateStr} ${timeStr}`
            );
            
            if (!newDateTime) return;
            
            try {
                // Parser la nouvelle date/heure
                const [datePart, timePart] = newDateTime.split(' ');
                const [day, month, year] = datePart.split('/');
                const [hours, minutes] = timePart.split(':');
                
                const newDate = new Date(year, month - 1, day, hours, minutes, 0, 0);
                const newTimestamp = newDate.getTime();
                
                if (isNaN(newTimestamp)) {
                    alert('Format invalide. Utilisez: JJ/MM/AAAA HH:MM');
                    return;
                }
                
                // Supprimer l'ancienne et ajouter la nouvelle
                if (!SCRIPT_URL || isSyncing) return;

                updateSyncStatus('Modification...', 'syncing');
                isSyncing = true;

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `action=edit&oldTimestamp=${oldTimestamp}&newTimestamp=${newTimestamp}`
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        showConfirmation('✓ Injection modifiée !');
                        await loadInjections();
                    } else {
                        throw new Error(data.error || 'Erreur de modification');
                    }
                } catch (error) {
                    console.error('Erreur de modification:', error);
                    alert('Erreur lors de la modification. Veuillez réessayer.');
                    updateSyncStatus('Erreur de sync', 'error');
                } finally {
                    isSyncing = false;
                }
                
            } catch (error) {
                alert('Format invalide. Utilisez: JJ/MM/AAAA HH:MM');
            }
        }

        // Supprimer une injection
        async function deleteInjection(timestamp) {
            const date = new Date(timestamp);
            const dateStr = date.toLocaleDateString('fr-FR');
            const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            if (!confirm(`Voulez-vous vraiment supprimer l'injection du ${dateStr} à ${timeStr} ?`)) {
                return;
            }
            
            if (!SCRIPT_URL || isSyncing) return;

            updateSyncStatus('Suppression...', 'syncing');
            isSyncing = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `action=delete&timestamp=${timestamp}`
                });

                const data = await response.json();
                
                if (data.success) {
                    showConfirmation('✓ Injection supprimée !');
                    await loadInjections();
                } else {
                    throw new Error(data.error || 'Erreur de suppression');
                }
            } catch (error) {
                console.error('Erreur de suppression:', error);
                alert('Erreur lors de la suppression. Veuillez réessayer.');
                updateSyncStatus('Erreur de sync', 'error');
            } finally {
                isSyncing = false;
            }
        }

        // Déterminer la période (matin/soir)
        function getPeriod(date) {
            const hours = date.getHours();
            if (hours >= 5 && hours < 12) return 'Matin';
            if (hours >= 12 && hours < 18) return 'Après-midi';
            return 'Soir';
        }

        // Formater la date
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const dateStr = date.toLocaleDateString('fr-FR', { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long' 
            });

            if (date.toDateString() === today.toDateString()) {
                return 'Aujourd\'hui';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Hier';
            }
            
            return dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        // Formater l'heure
        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('fr-FR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // Vérifier si une injection a été faite aujourd'hui
        function getLastInjectionToday(injections) {
            const today = new Date().toDateString();
            
            const todayInjections = injections
                .map(ts => ({ timestamp: ts, date: new Date(ts) }))
                .filter(inj => inj.date.toDateString() === today)
                .sort((a, b) => b.timestamp - a.timestamp);
            
            return todayInjections[0] || null;
        }

        // Obtenir les injections du matin et du soir d'aujourd'hui
        function getTodayInjections(injections) {
            const today = new Date().toDateString();
            
            const todayInjections = injections
                .map(ts => ({ timestamp: ts, date: new Date(ts) }))
                .filter(inj => inj.date.toDateString() === today);
            
            // Séparer matin (avant 14h) et soir (14h et après)
            const morning = todayInjections.filter(inj => inj.date.getHours() < 14).sort((a, b) => b.timestamp - a.timestamp)[0] || null;
            const evening = todayInjections.filter(inj => inj.date.getHours() >= 14).sort((a, b) => b.timestamp - a.timestamp)[0] || null;
            
            return { morning, evening, all: todayInjections };
        }

        // Mettre à jour l'affichage
        function updateDisplay(injections) {
            const todayInj = getTodayInjections(injections);
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const lastInjectionEl = document.getElementById('lastInjection');
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTimeInMinutes = currentHour * 60 + currentMinutes;
            
            // Définir les plages horaires
            const morningStartTime = 6 * 60 + 30; // 6h30
            const eveningStartTime = 18 * 60 + 30; // 18h30
            
            let needsMorning = false;
            let needsEvening = false;
            
            // Déterminer quelle injection est attendue selon l'heure
            if (currentTimeInMinutes >= morningStartTime && currentTimeInMinutes < eveningStartTime) {
                // Entre 6h30 et 18h30 : on attend l'injection du matin
                needsMorning = true;
            } else if (currentTimeInMinutes >= eveningStartTime) {
                // Après 18h30 : on attend l'injection du soir (et le matin doit être fait aussi)
                needsEvening = true;
            }
            // Avant 6h30 : rien n'est attendu encore
            
            // Vérifier le statut
            if (needsMorning && !todayInj.morning) {
                // Il est entre 6h30 et 18h30 et l'injection du matin n'est pas faite
                statusDot.className = 'status-dot pending';
                statusText.textContent = 'En attente d\'injection';
                lastInjectionEl.textContent = 'Injection du matin en attente';
            } else if (needsMorning && todayInj.morning && !needsEvening) {
                // Injection du matin faite, et il n'est pas encore 18h30
                statusDot.className = 'status-dot done';
                statusText.textContent = 'Injection effectuée aujourd\'hui';
                lastInjectionEl.innerHTML = `Injection du matin effectuée à <strong>${formatTime(todayInj.morning.timestamp)}</strong>`;
            } else if (needsEvening && !todayInj.evening) {
                // Il est après 18h30 et l'injection du soir n'est pas faite
                statusDot.className = 'status-dot pending';
                statusText.textContent = 'En attente d\'injection';
                if (todayInj.morning) {
                    lastInjectionEl.innerHTML = `Matin effectuée à <strong>${formatTime(todayInj.morning.timestamp)}</strong><br>Injection du soir en attente`;
                } else {
                    lastInjectionEl.innerHTML = '⚠️ Aucune injection effectuée aujourd\'hui';
                }
            } else if (needsEvening && todayInj.evening) {
                // Il est après 18h30 et l'injection du soir est faite
                statusDot.className = 'status-dot done';
                statusText.textContent = 'Injection effectuée aujourd\'hui';
                if (todayInj.morning && todayInj.evening) {
                    lastInjectionEl.innerHTML = `Les deux injections sont effectuées :<br>Matin : <strong>${formatTime(todayInj.morning.timestamp)}</strong> | Soir : <strong>${formatTime(todayInj.evening.timestamp)}</strong>`;
                } else {
                    lastInjectionEl.innerHTML = `Injection du soir effectuée à <strong>${formatTime(todayInj.evening.timestamp)}</strong>`;
                }
            } else {
                // Avant 6h30 du matin
                statusDot.className = 'status-dot pending';
                statusText.textContent = 'Aucune injection attendue pour le moment';
                if (todayInj.all.length > 0) {
                    const lastInj = todayInj.all.sort((a, b) => b.timestamp - a.timestamp)[0];
                    lastInjectionEl.innerHTML = `Dernière injection : <strong>${formatTime(lastInj.timestamp)}</strong>`;
                } else {
                    lastInjectionEl.textContent = 'Première injection du jour à partir de 6h30';
                }
            }

            updateHistory(injections);
        }

        // Mettre à jour l'historique
        function updateHistory(injections) {
            const historyList = document.getElementById('historyList');
            
            // Filtrer les 7 derniers jours
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const recentInjections = injections
                .filter(ts => ts > sevenDaysAgo)
                .sort((a, b) => b - a);

            if (recentInjections.length === 0) {
                historyList.innerHTML = '<div class="empty-state">Aucun historique disponible</div>';
                return;
            }

            historyList.innerHTML = recentInjections
                .map((timestamp, index) => {
                    const date = new Date(timestamp);
                    return `
                        <div class="history-item" style="animation-delay: ${index * 0.05}s">
                            <div class="history-item-content">
                                <div class="history-item-info">
                                    <div class="history-date">${formatDate(timestamp)}</div>
                                    <div class="history-time">${formatTime(timestamp)}</div>
                                </div>
                                <div class="history-period">${getPeriod(date)}</div>
                                <div class="history-actions">
                                    <button class="history-btn edit" onclick="editInjection(${timestamp})" title="Modifier">✏️</button>
                                    <button class="history-btn delete" onclick="deleteInjection(${timestamp})" title="Supprimer">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                })
                .join('');
        }

        // Auto-refresh toutes les 30 secondes
        setInterval(() => {
            if (SCRIPT_URL && !isSyncing) {
                loadInjections();
            }
        }, 30000);

        // Initialiser au chargement
        document.addEventListener('DOMContentLoaded', checkConfig);
    </script>
</body>
</html>
